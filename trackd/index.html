<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>boomboxd</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="boomboxd" />

    <!-- Static Open Graph / Twitter Card fallback for crawlers that don't run JS
         (Facebook, iMessage, WhatsApp, etc.). Pages set their own dynamic tags via
         react-helmet-async at runtime, which strips these data-seo-default tags on
         mount so JS-executing clients never see both sets at once. -->
    <meta data-seo-default name="description" content="Rate songs and albums. Share your taste." />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:site_name" content="boomboxd" />
    <meta data-seo-default property="og:title" content="boomboxd" />
    <meta data-seo-default property="og:description" content="Rate songs and albums. Share your taste." />
    <meta data-seo-default property="og:image" content="/icon-512.png" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:title" content="boomboxd" />
    <meta data-seo-default name="twitter:description" content="Rate songs and albums. Share your taste." />
    <meta data-seo-default name="twitter:image" content="/icon-512.png" />

    <style>body { background: #0d0d0d; }</style>
  </head>
  <body style="background:#0d0d0d;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
